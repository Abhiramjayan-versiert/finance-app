<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>FINANCE OS</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #08080a; color: #f5f5f7;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Roboto, "Segoe UI", sans-serif; }
  body { display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box;
    background: radial-gradient(60vmax 40vmax at 20% 10%, #2a2a2f, transparent 70%), radial-gradient(50vmax 50vmax at 85% 90%, #1d1d21, transparent 70%), #08080a; }
  .card { max-width: 360px; width: 100%; text-align: center; padding: 32px 24px; border-radius: 28px;
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.25), 0 24px 60px -20px rgba(0,0,0,0.6);
    -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); }
  h1 { font-size: 20px; margin: 16px 0 8px; letter-spacing: -0.01em; }
  p { margin: 0; color: #a1a1a8; font-size: 15px; line-height: 1.5; }
  button { margin-top: 24px; width: 100%; height: 48px; border: 0; border-radius: 999px; font-size: 16px; font-weight: 600;
    color: #fff; background: #0a7cf0; box-shadow: inset 0 1px 0 rgba(255,255,255,0.4); }
  button:active { transform: scale(0.96); }
  svg { width: 56px; height: 56px; }
</style>
</head>
<body>
  <div class="card" role="alert">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="10" fill="#1c1c20" stroke="rgba(255,255,255,0.2)"/><path d="M10 22V10h12" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M10 16h8" stroke="#fff" stroke-width="3" stroke-linecap="round" fill="none"/><circle cx="22.5" cy="21.5" r="2.5" fill="#fff" fill-opacity="0.85"/></svg>
    <h1>You're offline</h1>
    <p>FINANCE OS needs an internet connection to load your secure workspace. Your data is safe — check your connection and try again.</p>
    <button type="button" onclick="location.href='https://finance-os-versiert-solutions.vercel.app/dashboard'">Try again</button>
  </div>
</body>
</html>
