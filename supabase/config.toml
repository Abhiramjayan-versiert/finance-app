# Supabase CLI configuration (used by `supabase start` / `supabase db push`).
project_id = "finance-os"

[api]
port = 54321
schemas = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/confirm"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true
minimum_password_length = 8
password_requirements = "lower_upper_letters_digits"

[auth.rate_limit]
email_sent = 4
token_verifications = 30
sign_in_sign_ups = 30

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true
otp_length = 6
otp_expiry = 900
max_frequency = "60s"

[auth.email.template.confirmation]
subject = "Your FINANCE OS verification code"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Your FINANCE OS password reset code"
content_path = "./supabase/templates/recovery.html"

[storage]
file_size_limit = "5MiB"
